name: Publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows app
    runs-on: windows-2022

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Confirm the tag matches the application version
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag '${{ github.ref_name }}' does not match application version 'v$version'."
          }

      - name: Create isolated build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install torch==2.8.0+cpu torchaudio==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          .\.venv\Scripts\python.exe -m pip install ".[gui]" demucs==4.1.0 pyinstaller pytest

      - name: Run tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q

      - name: Build the one-file Windows application
        shell: pwsh
        run: .\build_exe.bat

      - name: Download the offline Demucs model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\demucs_models | Out-Null
          curl.exe --fail --location --retry 5 --retry-all-errors --output build\demucs_models\955717e8-8726e21a.th https://dl.fbaipublicfiles.com/demucs/hybrid_transformer/955717e8-8726e21a.th
          $expectedHash = '8726e21a993978c7ba086d3872e7608d7d5bfca646ca4aca459ffda844faa8b4'
          $actualHash = (Get-FileHash -LiteralPath build\demucs_models\955717e8-8726e21a.th -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Unexpected htdemucs model SHA-256: $actualHash" }
          'models: [955717e8]' | Set-Content -LiteralPath build\demucs_models\htdemucs.yaml -NoNewline

      - name: Build the offline Demucs edition
        shell: pwsh
        run: .\build_heavy_exe.bat

      - name: Verify the heavy bundle includes its offline model
        shell: pwsh
        run: |
          @'
          from PyInstaller.archive.readers import CArchiveReader

          archive = CArchiveReader("dist/chordz-heavy.exe")
          required = {
              "demucs_models\\955717e8-8726e21a.th",
              "demucs_models\\htdemucs.yaml",
          }
          missing = required - set(archive.toc)
          if missing:
              raise SystemExit(f"Heavy executable is missing bundled model files: {sorted(missing)}")
          print("Heavy executable contains the offline htdemucs model.")
          '@ | .\.venv\Scripts\python.exe -

      - name: Verify and name release assets
        shell: pwsh
        run: |
          $releaseAssets = @(
            @{ Source = 'dist\chordz.exe'; Name = "Chordz-${{ github.ref_name }}-windows-x64.exe" },
            @{ Source = 'dist\chordz-heavy.exe'; Name = "Chordz-${{ github.ref_name }}-windows-x64-demucs.exe" }
          )
          $checksums = [System.Collections.Generic.List[string]]::new()
          foreach ($releaseAsset in $releaseAssets) {
            if (-not (Test-Path -LiteralPath $releaseAsset.Source)) { throw "Expected build output '$($releaseAsset.Source)' was not created." }
            $bytes = [System.IO.File]::ReadAllBytes($releaseAsset.Source)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
            if ($subsystem -ne 2) { throw "Expected a Windows GUI executable, found PE subsystem $subsystem." }
            $destination = Join-Path 'dist' $releaseAsset.Name
            Move-Item -LiteralPath $releaseAsset.Source -Destination $destination
            $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksums.Add("$hash  $($releaseAsset.Name)")
          }
          ($checksums -join [Environment]::NewLine) | Set-Content -LiteralPath 'dist\SHA256SUMS.txt' -NoNewline

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Chordz-${{ github.ref_name }}-windows-x64.exe
            dist/Chordz-${{ github.ref_name }}-windows-x64-demucs.exe
            dist/SHA256SUMS.txt
